<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sexism Detection AI</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0ede8;
            --surface: #faf9f7;
            --text: #1a1714;
            --muted: #8a8078;
            --accent: #2d5be3;
            --accent-dark: #1e40c4;
            --danger-bg: #fdf0f0;
            --danger: #c0392b;
            --danger-border: #e8b4b0;
            --safe-bg: #f0faf4;
            --safe: #1a7a42;
            --safe-border: #a8ddb8;
            --border: #e2ddd8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 52px 48px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 16px 48px rgba(0,0,0,0.07);
        }

        .badge {
            display: inline-block;
            background: #eef2fd;
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--muted);
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 16px 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            resize: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder { color: #c0b8b0; }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45, 91, 227, 0.1);
        }

        .char-count {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
            margin-top: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover { background: var(--accent-dark); box-shadow: 0 4px 16px rgba(45,91,227,0.3); }
        button:active { transform: scale(0.99); }
        button:disabled { background: #b0bcd8; cursor: not-allowed; box-shadow: none; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #result-box {
            margin-top: 28px;
            padding: 20px 22px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .result-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .result-text {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
        }

        .result-sub {
            font-size: 13px;
            font-weight: 400;
            margin-top: 4px;
            opacity: 0.75;
        }

        .sexist {
            background: var(--danger-bg);
            border: 1.5px solid var(--danger-border);
            color: var(--danger);
        }

        .not-sexist {
            background: var(--safe-bg);
            border: 1.5px solid var(--safe-border);
            color: var(--safe);
        }

        .loading-state {
            background: #f5f4f2;
            border: 1.5px solid var(--border);
            color: var(--muted);
        }

        .error-state {
            background: #fffbf0;
            border: 1.5px solid #f0d890;
            color: #8a6500;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 36px 0 24px;
        }

        .footer {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        .footer span {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #c5c0b8;
            margin: 0 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">NLP Final Project</div>
    <h1>Sexism Detection AI</h1>
    <p class="subtitle">Enter any English text below to analyze it for sexist language using a fine-tuned BERT model.</p>

    <label class="input-label" for="inputText">Input Text</label>
    <textarea id="inputText" placeholder="e.g. Women don't belong in engineering fields..."></textarea>
    <div class="char-count"><span id="charCount">0</span> characters</div>

    <button id="analyzeBtn" onclick="checkSexism()">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Analyze Text</span>
    </button>

    <div id="result-box">
        <div class="result-label" id="result-label"></div>
        <div class="result-text" id="result-text"></div>
        <div class="result-sub" id="result-sub"></div>
    </div>

    <hr class="divider">
</div>

<script>
    const textarea = document.getElementById("inputText");
    const charCount = document.getElementById("charCount");

    textarea.addEventListener("input", () => {
        charCount.textContent = textarea.value.length;
    });

    async function checkSexism() {
        const text = textarea.value;
        const resultBox = document.getElementById("result-box");
        const btn = document.getElementById("analyzeBtn");
        const spinner = document.getElementById("spinner");
        const btnText = document.getElementById("btnText");

        if (!text.trim()) {
            alert("Please enter some text before analyzing.");
            return;
        }

        // Loading state
        btn.disabled = true;
        spinner.style.display = "block";
        btnText.textContent = "Analyzing...";
        resultBox.style.display = "block";
        resultBox.className = "loading-state";
        document.getElementById("result-label").textContent = "Status";
        document.getElementById("result-text").textContent = "Analyzing your text...";
        document.getElementById("result-sub").textContent = "The model is processing your input.";

        try {
            const response = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();

            // 👈 升級：動態將後端傳回的信心值 (data.confidence) 渲染到畫面上
            if (data.prediction === "Sexist") {
                resultBox.className = "sexist";
                document.getElementById("result-label").textContent = "Detection Result";
                document.getElementById("result-text").textContent = "⚠ Sexist content detected";
                document.getElementById("result-sub").innerHTML = `This text contains language associated with sexism.<br><br><strong>Model Confidence:</strong> ${data.confidence}%`;
            } else {
                resultBox.className = "not-sexist";
                document.getElementById("result-label").textContent = "Detection Result";
                document.getElementById("result-text").textContent = "✓ No sexist content detected";
                document.getElementById("result-sub").innerHTML = `This text appears to be free of sexist language.<br><br><strong>Model Confidence:</strong> ${data.confidence}%`;
            }
        } catch (error) {
            resultBox.className = "error-state";
            document.getElementById("result-label").textContent = "Connection Error";
            document.getElementById("result-text").textContent = "Unable to reach the backend API";
            document.getElementById("result-sub").textContent = "Make sure FastAPI is running: python main.py";
        } finally {
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.textContent = "Analyze Text";
        }
    }
</script>

</body>
</html>
